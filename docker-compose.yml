version: '3.8'

services:

  # ===========================
  # Laravel App (PHP + Apache)
  # ===========================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timebee_app
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=timebee_db
      - DB_USERNAME=timebee_user
      - DB_PASSWORD=timebee_pass
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=AIzaSyAGdL1V84S157VP9k-dvUeQgCqKOuSmOwQ
    networks:
      - timebee_network

  # ===========================
  # MySQL Database
  # ===========================
  db:
    image: mysql:8.0
    container_name: timebee_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: timebee_db
      MYSQL_USER: timebee_user
      MYSQL_PASSWORD: timebee_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - timebee_network

  # ===========================
  # phpMyAdmin (اختياري - لمشاهدة DB بسهولة)
  # ===========================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: timebee_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: timebee_user
      PMA_PASSWORD: timebee_pass
    depends_on:
      - db
    networks:
      - timebee_network

# ===========================
# Volumes & Networks
# ===========================
volumes:
  db_data:

networks:
  timebee_network:
    driver: bridge
